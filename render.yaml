# Discord-first StalZone artifact tracker.
# The tiny HTTP endpoint is only for Render health checks; there is no website.
services:
  - type: web
    name: stalzone-tracker
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_only.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REGION
        value: na
      - key: REALM
        value: global
      - key: SCAN_INTERVAL
        value: "300"
      - key: LOT_LIMIT
        value: "100"
      - key: DISCORD_TOKEN
        sync: false
      - key: EXBO_CLIENT_ID
        sync: false
      - key: EXBO_CLIENT_SECRET
        sync: false
