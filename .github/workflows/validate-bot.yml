name: Validate bot
on:
  push:
    branches: [bot-only-rebuild]
  pull_request:
    branches: [master]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bot
        run: python -m py_compile bot_only.py
